# Local DEV Postgres. The database and volume are still named `coglionazzi`:
# the app was renamed, the stored state was not (same rule as deploy/compose.yml,
# so nobody has to touch their gitignored packages/.env).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coglionazzi
    ports:
      - "5460:5432"
    volumes:
      - coglionazzi_data:/var/lib/postgresql

volumes:
  coglionazzi_data: {}
